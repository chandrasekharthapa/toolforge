[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toolforge"
version = "0.1.0"
description = "An agent that writes its own tools, proves they work (tests + differential fuzzing), sandboxes them, and serves them over MCP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chandra Sekhar Thapa" }]
keywords = ["agents", "llm", "tool-use", "langgraph", "mcp", "rag", "sandbox", "differential-testing"]
dependencies = [
    "langgraph>=0.2",
    "pydantic>=2.6",
    "numpy>=1.26",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
gemini = ["google-genai>=1.0"]
anthropic = ["anthropic>=0.40"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
mcp = ["mcp>=2.2"]
eval = ["matplotlib>=3.8"]
reranker = ["torch>=2.2", "transformers>=4.40"]
dev = ["pytest>=8", "ruff>=0.6", "fastapi>=0.110", "uvicorn>=0.29", "mcp>=2.2", "matplotlib>=3.8"]
all = ["toolforge[gemini,anthropic,api,mcp,eval]"]

[project.scripts]
toolforge = "toolforge.cli:main"

[tool.setuptools]
packages = ["toolforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E731", "B905"]

[tool.ruff.lint.per-file-ignores]
"toolforge/_harness.py" = ["B", "UP"]
